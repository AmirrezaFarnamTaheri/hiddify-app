org.gradle.jvmargs=-Xmx5120m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
# Flutter-provided ABI runtime JARs are AndroidX already. Keep Jetifier for
# legacy third-party libraries but bypass the expensive Flutter runtime transform.
android.jetifier.ignorelist=.*(arm64_v8a|armeabi_v7a|x86_64)_(debug|profile|release).*
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false


org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.configureondemand=true
org.gradle.caching=true