# Integration verification of desktop rollback changes; no workflow steps bypassed.
name: Hiddify lifecycle regression checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'integration/**'
      - 'fix/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-network-jvm:
    name: Android network helpers (real JUnit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Run network helper regressions
        run: gradle -p tools/network-jvm-tests --no-daemon test
      - name: Check OS callbacks never block waiting for the actor
        run: python3 -m unittest discover -s .github/scripts -p 'test_network_callback_source.py'

  desktop-guard-dart:
    name: Desktop lifecycle guard (Flutter test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - name: Resolve project dependencies
        run: flutter pub get
      - name: Run desktop process ownership regressions
        run: flutter test --reporter expanded test/hiddifycore/core_interface/core_process_restart_guard_test.dart
      - name: Generate source used by full Flutter test suite
        run: make common-prepare
      - name: Run full Flutter test suite
        run: flutter test --reporter expanded
      - name: Analyze complete Flutter/Dart sources
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  android-app-smoke:
    name: Android APK compile smoke (no signing)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK used by the app
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358"
      - name: Prepare generated code and the upstream native core
        run: make android-apk-prepare
      - name: Assemble non-release Android application
        run: flutter build apk --debug --target lib/main.dart
      - name: Save unsigned debug build for device validation
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hiddify-integration-debug-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7

  android-emulator-smoke:
    name: Launch debug APK on Android emulator
    needs: android-app-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: hiddify-integration-debug-apk
          path: integration-apk
      - name: Unit-test emulator smoke checks before starting the emulator
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Verify hardware acceleration is available for Android emulator
        run: |
          set -euo pipefail
          if ! test -c /dev/kvm; then
            echo "::error::Emulator cannot run: /dev/kvm unavailable on this runner"
            exit 1
          fi
          # udev cannot reliably change permissions on an already-created device.
          # Apply the access mode immediately, before the emulator action detects KVM.
          sudo chmod 666 /dev/kvm
          if ! (test -r /dev/kvm && test -w /dev/kvm); then
            echo "::error::Emulator cannot run: /dev/kvm unavailable to current user"
            exit 1
          fi
          stat -c 'KVM device: %n mode=%a owner=%U group=%G' /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          emulator-boot-timeout: 900
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/android-emulator-smoke.sh
