name: Hiddify lifecycle regression checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'integration/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-network-jvm:
    name: Android network helpers (real JUnit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Run network helper regressions
        run: gradle -p tools/network-jvm-tests --no-daemon test

  desktop-guard-dart:
    name: Desktop lifecycle guard (Flutter test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - name: Resolve project dependencies
        run: flutter pub get
      - name: Run desktop process ownership regressions
        run: flutter test --reporter expanded test/hiddifycore/core_interface/core_process_restart_guard_test.dart
